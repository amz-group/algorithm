<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="35%" stop-color="#F5C542" />
      <stop offset="70%" stop-color="#D4A72C" />
      <stop offset="100%" stop-color="#9E7307" />
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#F5C542" />
      <stop offset="100%" stop-color="#D4A72C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle subtle ambient -->
  <rect width="500" height="500" fill="transparent" />

  <!-- Outer Ring with Tech Gap -->
  <circle cx="250" cy="200" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="7" />

  <!-- Top Vertical Circuit Line & Node -->
  <line x1="250" y1="60" x2="250" y2="135" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="250" cy="55" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Bottom Vertical Circuit Line & Node -->
  <line x1="265" y1="265" x2="265" y2="330" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="265" cy="336" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Left Circuit Nodes & Traces -->
  <!-- Top diagonal trace -->
  <path d="M 175 145 L 140 145 L 122 125" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="116" cy="119" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Middle diagonal trace -->
  <path d="M 160 190 L 125 190 L 112 170" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="106" cy="164" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Lower diagonal trace -->
  <path d="M 155 225 L 135 225 L 112 200" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="106" cy="194" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Bottom angled trace -->
  <path d="M 185 270 L 150 235 L 142 225" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Stylized Monogram "K R D" -->
  <!-- Letter K & R & D Unified Polygon Mesh in Gold -->
  <g fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-linejoin="round">
    <!-- K Stem & Left diagonals -->
    <path d="M 160 140 L 235 140 L 180 200 L 230 260 L 175 260 L 145 220 L 145 260 L 180 260 L 180 265 L 160 265 Z" />

    <!-- K/R Central Cross & Diagonals -->
    <path d="M 195 140 L 285 140 L 285 160 L 225 160 L 225 195 L 280 195 L 295 210 L 295 260 L 255 260 L 255 220 L 210 220 L 245 260 L 195 260 L 165 220 L 195 185 Z" />

    <!-- R inner cutout -->
    <path d="M 225 165 L 265 165 C 275 165 275 190 265 190 L 225 190 Z" fill="#0D0D0D" stroke="#0D0D0D" stroke-width="2" />

    <!-- D Outer Large Curve -->
    <path d="M 275 140 L 320 140 C 375 140 405 165 405 200 C 405 235 375 260 320 260 L 275 260 L 275 235 L 320 235 C 355 235 375 220 375 200 C 375 180 355 165 320 165 L 275 165 Z" />

    <!-- Code Tag </> inside D -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Angle < -->
      <polyline points="330,188 318,200 330,212" />
      <!-- Center Slash / -->
      <line x1="345" y1="184" x2="335" y2="216" stroke-width="6" />
      <!-- Right Angle > -->
      <polyline points="350,188 362,200 350,212" />
    </g>
  </g>

  <!-- Typography: KRD -->
  <text x="250" y="380" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="56" letter-spacing="14" fill="url(#goldGrad)">
    KRD
  </text>

  <!-- Typography: —— ALGORITHM —— -->
  <!-- Left horizontal line -->
  <line x1="80" y1="406" x2="140" y2="406" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <text x="250" y="414" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="600" font-size="19" letter-spacing="12" fill="url(#goldGradLight)">
    ALGORITHM
  </text>
  
  <!-- Right horizontal line -->
  <line x1="360" y1="406" x2="420" y2="406" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
